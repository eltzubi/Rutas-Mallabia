# GitHub Pages publica el repositorio entero tal cual, y eso dejaba en produccion
# una copia indexable de cada pagina (los fragmentos src/*_tail.html, con el mismo
# texto y las mismas fotos que la pagina de verdad, sin canonical y sin titulo),
# ademas de las tablas de traduccion y las notas del proyecto. Aqui se quedan
# fuera de la publicacion.
#
# Lo que NO se excluye de src/ son las descargas: los .gpx, los .kml y el .zip
# cuelgan de ahi y estan enlazados desde las fichas de ruta.
exclude:
  # El registro de scripts/optimize_images.py: no forma parte del sitio.
  - img/.optimized.json
  # Los JPEG originales de 1600 px. Las fotos se sirven en WebP (el <img> en
  # .jpg es solo el respaldo, y para eso basta el de 800) y el visor tambien
  # abre el WebP, asi que estos no se los bajaba nadie: 194 MB del sitio
  # publicado por no servir a nadie. Se quedan en el repositorio como
  # original de donde salen las demas versiones, pero fuera de la web.
  # Los 57 que cada ficha declara como og:image siguen en img/, publicados.
  - img/orig
  - src/vendor
  - src/*.webmanifest
  - src/build.py
  - src/*.html
  - src/css
  - src/js
  - src/fonts
  - src/i18n
  - scripts
  - CLAUDE.md
  - DESIGN.md
  - README.md
