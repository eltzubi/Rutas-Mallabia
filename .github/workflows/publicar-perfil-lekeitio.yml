name: Publicar perfil y mapa de Lekeitio
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-perfil-lekeitio.yml]
permissions:
  contents: write
jobs:
  verificar-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar fuentes, perfil y geometría
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for suffix in ("", ".eu"):
              s=Path("src/lekeitio_tail"+suffix+".html").read_text()
              assert s.count('class="hero-chart"')==1
              assert s.index('class="hero-chart"')>s.index('<section class="map-section">')
              assert 'data-map-src="data/lekeitio.json"' in s
              assert 'min-height:320px' in s
          d=json.loads(Path("data/lekeitio.json").read_text())
          assert len(d["tracks"][0]["points"])>1000
          assert len(d["marker"]["at"])==2
          PY
      - name: Regenerar ambas páginas
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Verificar página construida y pruebas generales
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for suffix in ("", ".eu"):
              s=Path("lekeitio"+suffix+".html").read_text()
              assert s.index('class="hero-chart"')>s.index('<section class="map-section">')
              assert 'data/lekeitio.json' in s
              assert 'min-height:320px' in s
          PY
          python3 scripts/check_site.py
          node scripts/test_ui.cjs
          python3 scripts/verify_route_consistency.py
      - name: Guardar solo si pasa todo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publicar-perfil-lekeitio.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicar perfil junto al mapa en ficha Lekeitio ES y EU"
            git push origin HEAD:main
          fi
