name: Incorporar archivos de ruta Lekeitio
on:
  push:
    branches: [ruta-trabakua-lekeitio]
    paths: [lekeitio-subida-github.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar e importar paquete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          paquete = Path("lekeitio-subida-github.zip")
          if not paquete.is_file():
              raise SystemExit("Falta lekeitio-subida-github.zip; no se modifica nada")
          with zipfile.ZipFile(paquete) as z:
              nombres = z.namelist()
              if z.testzip():
                  raise SystemExit("ZIP dañado")
              esperados = {"src/lekeitio.gpx", "src/lekeitio.kml"}
              if not esperados.issubset(nombres):
                  raise SystemExit("Falta GPX o KML")
              fotos = [n for n in nombres if n.startswith("img/lekeitio-") and n.endswith(".webp")]
              if len(fotos) != 50:
                  raise SystemExit(f"Se esperaban 50 variantes WebP, hay {len(fotos)}")
              for nombre in nombres:
                  ruta = Path(nombre)
                  if ruta.is_absolute() or ".." in ruta.parts:
                      raise SystemExit(f"Ruta insegura: {nombre}")
                  if not (nombre in esperados or (nombre.startswith("img/lekeitio-") and nombre.endswith(".webp"))):
                      raise SystemExit(f"Archivo no previsto: {nombre}")
              for nombre in nombres:
                  destino = Path(nombre)
                  destino.parent.mkdir(parents=True, exist_ok=True)
                  destino.write_bytes(z.read(nombre))
              print(f"Importados {len(nombres)} archivos con CRC correcto")
          PY
      - name: Guardar los originales procesados en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lekeitio.gpx src/lekeitio.kml img/lekeitio-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Incorporar GPX y fotos web reales de ruta a Lekeitio"
            git push
          fi
