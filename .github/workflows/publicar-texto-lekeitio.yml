name: Verificar y publicar texto natural de Lekeitio
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-texto-lekeitio.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar cambios en los dos textos fuente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          es=Path('src/lekeitio_tail.html').read_text()
          eu=Path('src/lekeitio_tail.eu.html').read_text()
          assert 'y las piernas empiezan a notarlos' not in es
          assert 'hankak nabaritzen hasi dira' not in eu
          assert 'Al acercarnos a Amoroto empezamos a ver el mar' in es
          assert 'Amorotora hurbiltzean itsasoa ikusten hasten gara' in eu
          for s in [es,eu]:
              assert s.count('class="gallery-item"')==22
              assert s.count('class="elev-marker"')==4
          print('Texto natural comprobado y contenido de ruta intacto')
          PY
      - name: Construir traducciones y sitio
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Verificar contenido y JavaScript
        run: |
          python3 scripts/check_site.py
          node scripts/test_ui.cjs
          python3 scripts/verify_route_consistency.py
      - name: Verificar textos publicados ES y EU
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for suffix,fragment in [('', 'Al acercarnos a Amoroto empezamos a ver el mar'),('.eu','Amorotora hurbiltzean itsasoa ikusten hasten gara')]:
              s=Path('lekeitio'+suffix+'.html').read_text()
              assert fragment in s
              assert s.count('class="gallery-item"')==22
              assert s.count('class="elev-marker"')==4
              assert 'loc.wiki/t/294980049' in s
              assert 'href="trabakuaondarroa'+suffix+'.html"' in s
          print('Ambas fichas generadas, mapa y enlaces conservados')
          PY
      - name: Publicar cambios verificados en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publicar-texto-lekeitio.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicar texto más natural de la llegada a Lekeitio"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
