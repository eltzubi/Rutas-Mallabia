name: Terminar verificación integral de Lekeitio
on:
  push:
    branches: [main]
    paths: [.github/workflows/cerrar-revision-lekeitio.yml]
permissions:
  contents: write
jobs:
  verificar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chromium de comprobación
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Construir idiomas y páginas
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Verificar archivos, rutas y comportamiento JS
        run: |
          python3 scripts/check_site.py
          node scripts/test_ui.cjs
          python3 scripts/verify_route_consistency.py
      - name: Probar sitio completo en navegador real
        run: python3 .claude/skills/run-rutas-mallabia/driver.py todo
      - name: Comprobar anchura y mapa de ambas fichas
        run: |
          python3 .claude/skills/run-rutas-mallabia/driver.py audit lekeitio.html
          python3 .claude/skills/run-rutas-mallabia/driver.py audit lekeitio.eu.html
          python3 .claude/skills/run-rutas-mallabia/driver.py mapa lekeitio.html
          python3 .claude/skills/run-rutas-mallabia/driver.py mapa lekeitio.eu.html
      - name: Comprobar perfil, fotografías, título y posición real en móvil
        run: |
          python3 - <<'PY'
          import http.server, threading, socketserver
          from playwright.sync_api import sync_playwright
          class Handler(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          class Server(socketserver.ThreadingTCPServer): allow_reuse_address=True; daemon_threads=True
          with Server(('127.0.0.1',0), Handler) as server:
              threading.Thread(target=server.serve_forever,daemon=True).start()
              root=f'http://127.0.0.1:{server.server_address[1]}'
              try:
                  with sync_playwright() as pw:
                      browser=pw.chromium.launch(args=['--no-sandbox'])
                      for suffix in ('','.eu'):
                          for width in (360,390,768):
                              page=browser.new_page(viewport={'width':width,'height':850})
                              page.goto(root+'/lekeitio'+suffix+'.html',wait_until='load',timeout=30000)
                              page.locator('#routeMap.leaflet-container').wait_for(timeout=20000)
                              result=page.evaluate("""() => {
                                const chart=document.querySelector('.chart-visual');
                                const map=document.querySelector('#routeMap');
                                const sec=document.querySelector('.map-section');
                                const head=document.querySelector('h1');
                                const gallery=document.querySelectorAll('.gallery-item');
                                const photos=[...gallery].map(p=>p.dataset.lightboxSrc);
                                const r=map.getBoundingClientRect();
                                const c=chart.getBoundingClientRect();
                                return {width:document.body.scrollWidth,headline:!!head,
                                  h1:document.querySelectorAll('h1').length,
                                  cover:document.querySelector('#photoTrigger')?.dataset.lightboxSrc,
                                  images:gallery.length,unique:new Set(photos).size,
                                  map:map.classList.contains('leaflet-container'),
                                  lines:document.querySelectorAll('.leaflet-overlay-pane path').length,
                                  mapWidth:r.width,chartWidth:c.width,
                                  mapInSection:sec.contains(map),
                                  chartInSection:sec.contains(chart),
                                  chartAfterMap:map.compareDocumentPosition(chart)&Node.DOCUMENT_POSITION_FOLLOWING};
                              }""")
                              assert result['width']<=width, (suffix,width,'scroll lateral',result)
                              assert result['h1']==1 and result['headline'],result
                              assert result['images']==24 and result['unique']==24,result
                              assert result['cover']=='img/lekeitio-23.webp',result
                              assert result['map'] and result['mapWidth']>200 and result['lines']>0,result
                              assert result['mapInSection'] and result['chartInSection'] and result['chartAfterMap'],result
                              assert result['chartWidth']<=width,result
                              print('OK',suffix or 'es',width,result)
                              page.close()
                      browser.close()
              finally: server.shutdown()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comprobacion-visual-lekeitio
          path: .claude/skills/run-rutas-mallabia/capturas/
          if-no-files-found: ignore
      - name: Publicar fuentes reconstruidas y retirar workflow temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/cerrar-revision-lekeitio.yml
          git rm -f .github/workflows/publicar-perfil-lekeitio.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerar sitio y cerrar revisión visual completa de Lekeitio"
            git push origin HEAD:main
          fi
