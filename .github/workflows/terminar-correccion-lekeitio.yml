name: Finalizar corrección de mapa e icono Lekeitio
on:
  push:
    branches: [main]
    paths: [.github/workflows/terminar-correccion-lekeitio.yml]
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar correcciones específicas antes de compilar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          data=json.loads(Path("data/lekeitio.json").read_text())
          marker=data.get("marker")
          assert isinstance(marker,dict) and len(marker.get("at",[]))==2, "Marcador de mapa incorrecto"
          assert len(data["tracks"][0]["points"]) > 1000, "Faltan puntos reales del mapa"
          source=Path("src/lekeitio_tail.html").read_text()
          badge=re.search(r'<div class="hero-activity-badge"[^>]*>(.*?)</div>',source,re.S)
          assert badge and len(re.findall(r'<svg\b',badge.group(1)))==1, "La ruta solo a pie lleva bicicleta"
          assert 'data-map-src="data/lekeitio.json"' in source, "Falta el mapa"
          PY
      - name: Generar fichas en ambos idiomas
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Verificar fichas finales y compatibilidad
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for suffix in ("", ".eu"):
              page=Path("lekeitio"+suffix+".html").read_text()
              badge=re.search(r'<div class="hero-activity-badge"[^>]*>(.*?)</div>',page,re.S)
              assert badge and len(re.findall(r'<svg\b',badge.group(1)))==1, "Iconos incorrectos "+suffix
              assert re.search(r'data-map-src="data/lekeitio.json\?v=[0-9a-f]+"',page), "Version del mapa ausente "+suffix
              assert re.search(r'<section\b[^>]*class="[^"]*map-section',page), "No hay sección mapa "+suffix
          PY
          python3 scripts/check_site.py
          node scripts/test_ui.cjs
          python3 scripts/verify_route_consistency.py
      - name: Publicar únicamente tras superar pruebas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/terminar-correccion-lekeitio.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerar Lekeitio: mapa visible y solo senderismo"
            git push origin HEAD:main
          fi
