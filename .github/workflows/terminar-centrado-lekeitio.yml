name: Validar centrado y publicar ficha Lekeitio
on:
  push:
    branches: [main]
    paths: [.github/workflows/terminar-centrado-lekeitio.yml]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar la estructura antes de generar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.errors=[]
              def handle_starttag(self, tag, attrs):
                  if tag in ('div','section','main','header','footer'):
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in ('div','section','main','header','footer'):
                      if not self.stack or self.stack[-1]!=tag:
                          self.errors.append(f'Expected {self.stack[-1] if self.stack else "nothing"}, closing {tag}')
                      else: self.stack.pop()
          for suffix in ('','.eu'):
              s=Path('src/lekeitio_tail'+suffix+'.html').read_text()
              assert s.count('class="hero-label"')==1, suffix
              assert s.count('class="hero-chart"')==1, suffix
              assert s.index('class="hero-label"') < s.index('class="map-section"') < s.index('class="hero-chart"') < s.index('id="routeMap"'), suffix
              assert s.count('class="gallery-item"')==24, suffix
              p=Check(); p.feed(s)
              assert not p.errors and not p.stack, (suffix,p.errors,p.stack)
          PY
      - name: Regenerar traducciones y páginas
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Verificar sitio y JavaScript
        run: |
          python3 scripts/check_site.py
          node scripts/test_ui.cjs
          python3 scripts/verify_route_consistency.py
      - name: Publicar únicamente si las pruebas pasan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/terminar-centrado-lekeitio.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerar ficha Lekeitio centrada con título y perfil junto al mapa"
            git push origin HEAD:main
          fi
