name: Publicar orden definitivo de fotografías Lekeitio
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-orden-fotografias-lekeitio.yml]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar portada inicial, puente penúltimo y mar último
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for suffix in ('','.eu'):
              s=Path('src/lekeitio_tail'+suffix+'.html').read_text()
              fotos=re.findall(r'class="gallery-item" data-lightbox-src="img/lekeitio-(\d\d)\.webp"',s)
              assert len(fotos)==22 and len(set(fotos))==22,(suffix,len(fotos))
              assert fotos[-3:]==['25','23','24'],(suffix,fotos[-3:])
              assert '01' not in fotos and '04' not in fotos and '07' not in fotos
              assert s.count('id="photoTrigger" data-lightbox-src="img/lekeitio-01.webp"')==1
              assert 'loc.wiki/t/294980049' in s
              assert s.count('id="routeMap"')==1
              assert s.count('class="elev-marker"')==6
          for suffix in ('','.eu'):
              s=Path('src/mallabia_tail'+suffix+'.html').read_text()
              assert 'img/lekeitio-01-800.webp' in s
          print('Orden y contenido de portada y ficha correctos, ambos idiomas')
          PY
      - name: Reconstruir castellano y euskera
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Ejecutar pruebas del sitio
        run: |
          python3 scripts/check_site.py
          python3 scripts/verify_route_consistency.py
          node scripts/test_ui.cjs
      - name: Verificar HTML generado y metadatos
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for suffix in ('','.eu'):
              s=Path('lekeitio'+suffix+'.html').read_text()
              fotos=re.findall(r'class="gallery-item" data-lightbox-src="img/lekeitio-(\d\d)\.webp"',s)
              assert len(fotos)==22 and fotos[-3:]==['25','23','24'],(suffix,fotos[-3:])
              assert 'id="photoTrigger" data-lightbox-src="img/lekeitio-01.webp"' in s
              assert 'https://trabakutik.com/img/lekeitio-01.webp' in s
              assert 'href="src/lekeitio.gpx"' in s
              assert 'href="src/lekeitio.kml"' in s
              assert 'loc.wiki/t/294980049' in s
              assert s.count('id="routeMap"')==1
          print('HTML generado correctamente en ES y EU')
          PY
      - name: Publicar cambios aprobados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publicar-orden-fotografias-lekeitio.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicar foto del puente penúltima y mar última en Lekeitio"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
