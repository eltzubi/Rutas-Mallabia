name: Publicar Lekeitio sin punto erróneo de Iruzubieta
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-sin-iruzubieta-lekeitio.yml]
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar seis puntos y enlaces, sin Iruzubieta
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path('data/lekeitio.json').read_text())
          assert len(d['waypoints'])==6
          assert [43.263852,-2.521912] not in d['waypoints']
          for suffix in ('','.eu'):
              s=Path('src/lekeitio_tail'+suffix+'.html').read_text()
              assert s.count('class="elev-marker"')==6
              assert s.count('class="elev-legend-item"')==6
              assert 'Iruzubieta &middot;' not in s
              legend=re.search(r'<div class="elev-legend">([\s\S]*?)</div>',s).group(1)
              assert re.findall(r'<span class="num">(\d+)</span>',legend)==list('123456')
              marks=re.findall(r'<g class="elev-marker">([\s\S]*?)</g>',s)
              assert [re.search(r'<text[^>]*>(\d+)</text>',m).group(1) for m in marks]==list('123456')
              assert 'loc.wiki/t/294980049' in s
              assert 'href="src/lekeitio.gpx"' in s
              assert 'href="src/lekeitio.kml"' in s
              assert s.count('class="gallery-item"')==24
          print('Seis puntos correctos; enlace Wikiloc y descargas conservados')
          PY
      - name: Regenerar web ES y EU
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Verificar páginas y scripts
        run: |
          python3 scripts/check_site.py
          python3 scripts/verify_route_consistency.py
          node scripts/test_ui.cjs
          python3 - <<'PY'
          from pathlib import Path
          for suffix in ('','.eu'):
              s=Path('lekeitio'+suffix+'.html').read_text()
              assert s.count('class="elev-marker"')==6
              assert s.count('class="elev-legend-item"')==6
              assert 'Iruzubieta &middot;' not in s
              assert 'loc.wiki/t/294980049' in s
              assert 'href="src/lekeitio.gpx"' in s
              assert 'href="src/lekeitio.kml"' in s
          print('Páginas generadas y enlaces correctos')
          PY
      - name: Guardar regeneración validada en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publicar-sin-iruzubieta-lekeitio.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicar Lekeitio con seis puntos correctos en ambos idiomas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
