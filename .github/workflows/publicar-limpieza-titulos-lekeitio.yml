name: Verificar títulos y regenerar ficha Lekeitio
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-limpieza-titulos-lekeitio.yml]
permissions:
  contents: write
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar web bilingüe
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Revisar títulos sin duplicaciones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          for suff in ('','.eu'):
              source=Path('src/lekeitio_tail'+suff+'.html').read_text()
              page=Path('lekeitio'+suff+'.html').read_text()
              assert source.count('<h1>')==1 and page.count('<h1>')==1
              assert 'class="full-name"' not in page
              assert page.count('class="gallery-item"')==24
              assert page.count('id="routeMap"')==1
              assert page.index('class="hero-chart"')<page.index('class="hero-label"')<page.index('class="map-section"')
              assert 'data/lekeitio.json' in page
          print('Cabecera sin texto redundante, mapa y galería correctos en ES/EU')
          PY
          python3 scripts/check_site.py
          node scripts/test_ui.cjs
          python3 scripts/verify_route_consistency.py
      - name: Publicar páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publicar-limpieza-titulos-lekeitio.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Eliminar redundancias de títulos en Lekeitio y regenerar ambos idiomas"
            git push origin HEAD:main
          fi
