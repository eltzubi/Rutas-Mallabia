name: Verificar ficha Lekeitio con estructura estándar
on:
  push:
    branches: [main]
    paths: [.github/workflows/verificar-ficha-lekeitio-estandar.yml]
permissions:
  contents: write
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparar estructura con una ruta correcta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Structure(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.errors=[]
              def handle_starttag(self,tag,attrs):
                  if tag in ('div','section','main','header','footer'): self.stack.append(tag)
              def handle_endtag(self,tag):
                  if tag in ('div','section','main','header','footer'):
                      if not self.stack or self.stack[-1]!=tag: self.errors.append((tag,self.stack[-1] if self.stack else None))
                      else: self.stack.pop()
          for suffix in ('','.eu'):
              s=Path('src/lekeitio_tail'+suffix+'.html').read_text()
              assert s.count('class="hero-chart"') == 1
              assert s.count('class="hero-label"') == 1
              assert s.count('class="gallery-item"') == 24
              assert s.count('id="routeMap"') == 1
              assert 'route-elevation-near-map' not in s
              assert s.index('class="hero-chart"') < s.index('class="hero-label"') < s.index('class="map-section"')
              assert 'data-map-src="data/lekeitio.json"' in s
              assert 'img/lekeitio-23.webp' in s
              p=Structure(); p.feed(s)
              assert not p.stack and not p.errors, (suffix,p.errors,p.stack)
          print('Estructura y anidación correctas en ambos idiomas')
          PY
      - name: Generar euskera y sitio
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Pruebas de sitio, JavaScript y rutas
        run: |
          python3 scripts/check_site.py
          node scripts/test_ui.cjs
          python3 scripts/verify_route_consistency.py
      - name: Comprobar HTML publicado antes de guardar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for suffix in ('','.eu'):
              p=Path('lekeitio'+suffix+'.html').read_text()
              assert p.index('class="hero-chart"') < p.index('class="hero-label"') < p.index('class="map-section"')
              assert p.count('class="gallery-item"')==24
              assert p.count('id="routeMap"')==1
              assert 'data/lekeitio.json' in p
          print('HTML generado correcto')
          PY
      - name: Guardar páginas regeneradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/verificar-ficha-lekeitio-estandar.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Reconstruir ficha Lekeitio con patrón estándar"
            git push origin HEAD:main
          fi
