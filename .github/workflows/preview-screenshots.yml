name: Preview screenshots
on:
  push:
    branches:
      - chatgpt/diseno-previa-20260924

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/trabakutik-http.log 2>&1 &
          echo $! > /tmp/trabakutik-http.pid
          sleep 2
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium
      - name: Capture previews
        run: |
          node <<'NODE'
          const { chromium, devices } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const cases = [
              ['home-mobile.png', devices['iPhone 13'], 'http://127.0.0.1:8000/index.html'],
              ['route-mobile.png', devices['iPhone 13'], 'http://127.0.0.1:8000/santaeufemia.html'],
              ['home-desktop.png', { viewport: { width: 1440, height: 1000 } }, 'http://127.0.0.1:8000/index.html'],
              ['route-desktop.png', { viewport: { width: 1440, height: 1000 } }, 'http://127.0.0.1:8000/santaeufemia.html']
            ];
            for (const [name, ctxOpts, url] of cases) {
              const ctx = await browser.newContext(ctxOpts);
              const page = await ctx.newPage();
              await page.goto(url, {waitUntil:'networkidle'});
              await page.screenshot({path:name, fullPage:true});
              await ctx.close();
            }
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: trabakutik-preview-screenshots
          path: |
            home-mobile.png
            route-mobile.png
            home-desktop.png
            route-desktop.png
