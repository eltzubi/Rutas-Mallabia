name: Regenerate Ahuntzen branch

on:
  push:
    branches:
      - codex/ahuntzen-fotos-correccion

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ahuntzen-fotos-correccion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate site
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "Already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate site after Ahuntzen update"
          git push origin HEAD:codex/ahuntzen-fotos-correccion
