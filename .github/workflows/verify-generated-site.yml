name: Verify generated site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate Basque pages
        run: python3 src/i18n/make_eu.py

      - name: Rebuild published site
        run: python3 src/build.py

      - name: Commit generated files on Ahuntzen branch
        run: |
          if git diff --quiet; then
            echo "Generated site already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate site after Ahuntzen update"
          git push origin HEAD:codex/ahuntzen-fotos-correccion
