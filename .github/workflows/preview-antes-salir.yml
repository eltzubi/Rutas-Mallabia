name: Preview antes de salir

on:
  push:
    branches:
      - chatgpt/antes-salir-preview-20260924

jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Site checks
        run: python3 scripts/check_site.py
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Render mobile preview
        run: |
          python3 -m http.server 8000 >/tmp/trabakutik-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path("preview-artifact")
          out.mkdir(exist_ok=True)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 360, "height": 800}, device_scale_factor=1)
              page.goto("http://127.0.0.1:8000/index.es.html", wait_until="networkidle")
              page.screenshot(path=str(out / "mobile-top.png"), full_page=False)

              selectors = {
                  "hero": ".hero-compact",
                  "section": "#beforeYouGo",
                  "notice": "#beforeYouGo .notice-details summary",
                  "finder": ".finder",
                  "search": ".route-search",
              }
              boxes = {}
              for name, sel in selectors.items():
                  box = page.locator(sel).bounding_box()
                  boxes[name] = box

              metrics = {
                  "viewport": {"width": 360, "height": 800},
                  "boxes": boxes,
                  "hero_to_notice": round(boxes["notice"]["y"] - (boxes["hero"]["y"] + boxes["hero"]["height"]), 2),
                  "notice_height": round(boxes["notice"]["height"], 2),
                  "notice_to_search": round(boxes["search"]["y"] - (boxes["notice"]["y"] + boxes["notice"]["height"]), 2),
                  "hero_to_search": round(boxes["search"]["y"] - (boxes["hero"]["y"] + boxes["hero"]["height"]), 2),
              }
              (out / "metrics.json").write_text(json.dumps(metrics, indent=2), encoding="utf-8")
              print(json.dumps(metrics, indent=2))
              browser.close()
          PY
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: antes-salir-mobile-preview
          path: preview-artifact/
