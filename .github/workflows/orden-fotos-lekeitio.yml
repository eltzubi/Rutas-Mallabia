name: Publicar foto del mar al final de Lekeitio
on:
  push:
    branches: [main]
    paths: [.github/workflows/orden-fotos-lekeitio.yml]
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar galería en origen
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for suffix in ('','.eu'):
              s=Path('src/lekeitio_tail'+suffix+'.html').read_text()
              fotos=re.findall(r'class="gallery-item" data-lightbox-src="img/lekeitio-(\d\d)\.webp"',s)
              assert len(fotos)==24 and len(set(fotos))==24
              assert fotos[-2:]==['25','24'],(suffix,fotos[-3:])
              assert 'id="photoTrigger" data-lightbox-src="img/lekeitio-23.webp"' in s
              assert s.count('id="routeMap"')==1
          print('Foto del mar al final en ES y EU, portada y mapa intactos')
          PY
      - name: Regenerar páginas siguiendo normas Trabakutik
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Verificar web, JS y rutas
        run: |
          python3 scripts/check_site.py
          node scripts/test_ui.cjs
          python3 scripts/verify_route_consistency.py
      - name: Comprobar páginas generadas
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for suffix in ('','.eu'):
              s=Path('lekeitio'+suffix+'.html').read_text()
              fotos=re.findall(r'class="gallery-item" data-lightbox-src="img/lekeitio-(\d\d)\.webp"',s)
              assert len(fotos)==24 and fotos[-2:]==['25','24'],(suffix,fotos[-3:])
              assert s.count('id="photoTrigger"')==1
          print('Páginas finales con foto del mar última')
          PY
      - name: Publicar cambios comprobados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/orden-fotos-lekeitio.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicar mar de Lekeitio como última foto de galería"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
