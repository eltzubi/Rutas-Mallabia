name: Verify route consistency

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check route cards and overview map
        run: python3 scripts/verify_route_consistency.py
