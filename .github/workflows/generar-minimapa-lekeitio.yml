name: Generar minimapa de Lekeitio
on:
  pull_request:
    paths:
      - '.github/workflows/generar-minimapa-lekeitio.yml'
permissions:
  contents: read
jobs:
  minimapa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/make_card_maps.py
            data/trailhead.json
            src/mallabia_tail.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow playwright
      - run: python -m playwright install --with-deps chromium
      - name: Dibujar con el generador existente
        run: |
          mkdir -p img
          python - <<'PY'
          import importlib.util, sys
          from playwright.sync_api import sync_playwright
          spec = importlib.util.spec_from_file_location("cardmaps", "scripts/make_card_maps.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with sync_playwright() as p:
              executable = p.chromium.executable_path
          module.navegador = lambda: executable
          sys.argv = ["make_card_maps.py", "--solo", "lekeitio"]
          module.main()
          from PIL import Image
          image = Image.open("img/mapa-lekeitio.webp").convert("RGB")
          assert image.size == (640, 400), image.size
          assert len(image.getcolors(image.width * image.height)) > 1000, "Mapa vacío"
          assert sum(g > r * 1.1 and r > b * 1.1 and 20 < r < 140 for r,g,b in image.getdata()) > 100, "Falta el trazado verde"
          print("Minimapa generado y comprobado")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minimapa-lekeitio
          path: img/mapa-lekeitio.webp
          retention-days: 3
