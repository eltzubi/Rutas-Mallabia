name: Regenerar y auditar Lekeitio en navegador
on:
  push:
    branches: [main]
    paths: [.github/workflows/auditar-lekeitio-navegador.yml]
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Reconstruir desde fuentes
        run: |
          python3 src/i18n/make_eu.py
          python3 src/build.py
      - name: Verificar estructura e integridad de todas las rutas
        run: |
          python3 scripts/check_site.py
          node scripts/test_ui.cjs
          python3 scripts/verify_route_consistency.py
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          for suffix in ('','.eu'):
              s=Path('lekeitio'+suffix+'.html').read_text()
              assert s.count('id="routeMap"')==1
              assert s.count('class="gallery-item"')==24
              assert s.index('class="hero-chart"')<s.index('class="hero-label"')<s.index('class="map-section"')
              assert 'min-height:320px' not in s
              assert re.search(r'data-map-src="data/lekeitio.json(?:\\?v=[a-f0-9]+)?"',s)
          d=json.loads(Path('data/lekeitio.json').read_text())
          assert len(d['tracks'][0]['points'])>1000
          assert len(d['marker']['at'])==2
          print('Estructura ES/EU, ruta, fotos, marcador y mapas correctos')
          PY
      - name: Auditar centrado a 320, 360, 390, 768 y 1280 píxeles
        run: |
          python3 .claude/skills/run-rutas-mallabia/driver.py audit lekeitio.html
          python3 .claude/skills/run-rutas-mallabia/driver.py audit lekeitio.eu.html
      - name: Probar Leaflet con ruta dibujada
        run: |
          python3 .claude/skills/run-rutas-mallabia/driver.py mapa lekeitio.html
          python3 .claude/skills/run-rutas-mallabia/driver.py mapa lekeitio.eu.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lekeitio-auditoria-final
          path: .claude/skills/run-rutas-mallabia/capturas/
          if-no-files-found: ignore
      - name: Publicar HTML generado si todo ha pasado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/auditar-lekeitio-navegador.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicar corrección de mapa centrado en Lekeitio ES y EU"
            git push origin HEAD:main
          fi
